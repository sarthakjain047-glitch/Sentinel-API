<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAPI — Zero-Trust API Vulnerability Scanner</title>

  <!-- Typography: Editorial Serif, High-Impact Sans, Monospace & Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      /* High-Tech Racing & Editorial Palette */
      --bg-void: #07090B;
      --bg-surface: #0E1216;
      --bg-card: rgba(16, 21, 27, 0.88);
      --bg-card-border: rgba(255, 255, 255, 0.12);

      /* Electric Volt Signature Accent */
      --accent-volt: #D8FF00;
      --accent-volt-glow: rgba(216, 255, 0, 0.45);

      /* Typography */
      --text-pure: #FFFFFF;
      --text-muted: #8E9BA8;
      --text-dim: #54606E;

      /* Desaturated & Clear Severity Indicators (Shared with Findings Badges) */
      --sev-critical: #FF3B5C;
      --sev-high: #FF8A00;
      --sev-medium: #FFD000;
      --sev-low: #00E5A3;
    }

    /* Smooth Scroll Base */
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }
    .lenis.lenis-stopped {
      overflow: hidden;
    }

    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-void);
      color: var(--text-pure);
      overflow-x: clip;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.04em;
    }

    .font-serif-luxury {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Ambient Canvas */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Topographic Contour Line Overlay */
    .contour-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.04;
      background-image: radial-gradient(circle at 75% 35%, transparent 120px, #ffffff 121px, transparent 122px),
                        radial-gradient(circle at 75% 35%, transparent 220px, #ffffff 221px, transparent 222px),
                        radial-gradient(circle at 75% 35%, transparent 340px, #ffffff 341px, transparent 342px),
                        radial-gradient(circle at 75% 35%, transparent 480px, #ffffff 481px, transparent 482px);
    }

    /* Glassmorphic Tiles */
    .glass-tile {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--bg-card-border);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-tile:hover {
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Action Buttons */
    .btn-volt-pill {
      background: var(--accent-volt);
      color: #07090B;
      font-weight: 800;
      border-radius: 9999px;
      transition: all 0.2s ease;
      box-shadow: 0 0 18px var(--accent-volt-glow);
    }
    .btn-volt-pill:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 28px rgba(216, 255, 0, 0.6);
    }

    /* Horizontal Slider Setup */
    .horizontal-wrapper {
      position: relative;
      width: 100%;
    }
    .horizontal-slider {
      display: flex;
      flex-wrap: nowrap;
      height: 100vh;
      width: 500vw;
      will-change: transform;
    }
    .horizontal-panel {
      width: 100vw;
      min-height: 100vh;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 2rem 2rem;
      box-sizing: border-box;
      position: relative;
      overflow-x: clip;
    }

    /* Hardware Accelerated Assemble-In Pieces */
    .assemble-l, .assemble-r {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Kinetic Flowing Loading Bar */
    .kinetic-track {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    .kinetic-fill {
      height: 100%;
      background: linear-gradient(90deg, #10B981 0%, #D8FF00 50%, #F59E0B 100%);
      background-size: 200% 100%;
      animation: kineticFlow 2s linear infinite;
      box-shadow: 0 0 20px rgba(216, 255, 0, 0.5);
      border-radius: inherit;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    @keyframes kineticFlow {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #07090B;
    }
    ::-webkit-scrollbar-thumb {
      background: #252D37;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-volt);
    }
  </style>

  <!-- External Library CDNs: Lenis, GSAP, ScrollTrigger, Three.js, React, Babel -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Ambient Persistent Layers -->
  <div class="contour-lines"></div>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- React Root Container -->
  <div id="root" class="relative z-10"></div>

  <!-- Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SECTION_GAP = 1200; // Consistent scroll distance per section boundary

    // --- ACCESSIBILITY GUARDRAILS ---
    function useReducedMotionSafe() {
      const [prefersReduced, setPrefersReduced] = useState(false);
      useEffect(() => {
        const query = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReduced(query.matches);
        const listener = (e) => setPrefersReduced(e.matches);
        query.addEventListener('change', listener);
        return () => query.removeEventListener('change', listener);
      }, []);
      return prefersReduced;
    }

    // --- UNIVERSAL ASSEMBLE ANIMATION HELPER ---
    function assembleInSection(sectionEl, prefersReduced = false) {
      if (!sectionEl || !window.gsap) return;
      const leftPieces = sectionEl.querySelectorAll('.assemble-l');
      const rightPieces = sectionEl.querySelectorAll('.assemble-r');

      if (prefersReduced) {
        gsap.set([...leftPieces, ...rightPieces], {
          xPercent: 0,
          opacity: 1,
          clearProps: 'transform'
        });
        return;
      }

      if (!leftPieces.length && !rightPieces.length) return;

      gsap.killTweensOf([...leftPieces, ...rightPieces]);

      const tl = gsap.timeline({
        defaults: { duration: 0.85, ease: 'power3.out' },
        onComplete: () => {
          gsap.set([...leftPieces, ...rightPieces], { clearProps: 'transform' });
        }
      });

      gsap.set(leftPieces, { xPercent: -120, opacity: 0 });
      gsap.set(rightPieces, { xPercent: 120, opacity: 0 });

      tl.to(leftPieces, { xPercent: 0, opacity: 1, stagger: 0.05 }, 0)
        .to(rightPieces, { xPercent: 0, opacity: 1, stagger: 0.04 }, 0.03);

      return tl;
    }

    // --- THREE.JS CYBERNETIC DATA STREAM & GRAPH LAYER (SEVERITY MOOD SHIFT) ---
    function initAmbientScene(canvas, prefersReduced, activeSeverityStateRef) {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 16;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

      const count = 120;
      const positions = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 38;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 24;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 12;

        velocities[i * 3] = (Math.random() - 0.5) * 0.005;
        velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.005;
        velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.003;
      }

      const pointGeo = new THREE.BufferGeometry();
      pointGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      // Initial calm resting color (Electric Volt Accent #D8FF00)
      const currentThreeColor = new THREE.Color(0xD8FF00);
      const pointMat = new THREE.PointsMaterial({
        size: 0.18,
        color: currentThreeColor,
        transparent: true,
        opacity: 0.5
      });
      const points = new THREE.Points(pointGeo, pointMat);
      scene.add(points);

      const maxConn = 140;
      const linePositions = new Float32Array(maxConn * 6);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
      const lineMat = new THREE.LineBasicMaterial({
        color: new THREE.Color(0x3B4654),
        transparent: true,
        opacity: 0.28,
        depthWrite: false
      });
      const lines = new THREE.LineSegments(lineGeo, lineMat);
      scene.add(lines);

      // Severity Color Map (Pulled strictly from CSS severity tokens)
      const SEVERITY_COLORS = {
        idle: '#D8FF00',      // Calm resting volt accent
        Low: '#00E5A3',       // --sev-low
        Medium: '#FFD000',    // --sev-medium
        High: '#FF8A00',      // --sev-high
        Critical: '#FF3B5C',  // --sev-critical
        error: '#8E9BA8'      // Distinct neutral error tone
      };

      let lastAppliedColorKey = 'idle';

      let targetCamX = 0;
      let targetCamY = 0;

      const onMouseMove = (e) => {
        targetCamX = (e.clientX / window.innerWidth - 0.5) * 1.5;
        targetCamY = -(e.clientY / window.innerHeight - 0.5) * 1.5;
      };
      window.addEventListener('mousemove', onMouseMove, { passive: true });

      const onResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };
      window.addEventListener('resize', onResize);

      let animId;
      function animate() {
        // --- SEVERITY MOOD SHIFT INTERPOLATION ---
        const desiredKey = activeSeverityStateRef.current || 'idle';
        if (desiredKey !== lastAppliedColorKey) {
          lastAppliedColorKey = desiredKey;
          const hexStr = SEVERITY_COLORS[desiredKey] || SEVERITY_COLORS.idle;
          const targetColorObj = new THREE.Color(hexStr);

          if (window.gsap) {
            const tweenDuration = prefersReduced ? 0.05 : 2.2;
            window.gsap.to(pointMat.color, {
              r: targetColorObj.r,
              g: targetColorObj.g,
              b: targetColorObj.b,
              duration: tweenDuration,
              ease: 'power2.out'
            });
          } else {
            pointMat.color.copy(targetColorObj);
          }
        }

        if (!prefersReduced) {
          const pos = pointGeo.attributes.position.array;
          for (let i = 0; i < count; i++) {
            pos[i * 3] += velocities[i * 3];
            pos[i * 3 + 1] += velocities[i * 3 + 1];
            pos[i * 3 + 2] += velocities[i * 3 + 2];

            if (Math.abs(pos[i * 3]) > 20) pos[i * 3] *= -0.96;
            if (Math.abs(pos[i * 3 + 1]) > 13) pos[i * 3 + 1] *= -0.96;
          }
          pointGeo.attributes.position.needsUpdate = true;

          camera.position.x += (targetCamX - camera.position.x) * 0.03;
          camera.position.y += (targetCamY - camera.position.y) * 0.03;
          camera.lookAt(0, 0, 0);

          let lineIdx = 0;
          for (let i = 0; i < count && lineIdx < maxConn; i++) {
            for (let j = i + 1; j < count && lineIdx < maxConn; j++) {
              const dx = pos[i * 3] - pos[j * 3];
              const dy = pos[i * 3 + 1] - pos[j * 3 + 1];
              const dz = pos[i * 3 + 2] - pos[j * 3 + 2];
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < 16) {
                const p = lineIdx * 6;
                linePositions[p] = pos[i * 3];
                linePositions[p + 1] = pos[i * 3 + 1];
                linePositions[p + 2] = pos[i * 3 + 2];
                linePositions[p + 3] = pos[j * 3];
                linePositions[p + 4] = pos[j * 3 + 1];
                linePositions[p + 5] = pos[j * 3 + 2];
                lineIdx++;
              }
            }
          }
          lineGeo.attributes.position.needsUpdate = true;
          lineGeo.setDrawRange(0, lineIdx * 2);
        }
        renderer.render(scene, camera);
        animId = requestAnimationFrame(animate);
      }
      animate();

      return () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('resize', onResize);
        renderer.dispose();
      };
    }

    // --- MAIN APP COMPONENT ---
    function SentinelApp() {
      const [activeSection, setActiveSection] = useState('home');
      const [selectedFinding, setSelectedFinding] = useState(null);

      // Scanner State Management
      const [scanState, setScanState] = useState({
        active: false,
        id: null,
        status: 'idle',
        progress: 0,
        total: 0,
        error: null
      });

      const [findings, setFindings] = useState([]);
      const [targetUrl, setTargetUrl] = useState('http://demo-target:8001');
      const [lastScanMeta, setLastScanMeta] = useState({
        url: 'http://demo-target:8001',
        critical: 1,
        high: 3,
        status: 'READY'
      });

      // --- SEVERITY RANKING & AMBIENT MOOD STATE ---
      const SEVERITY_RANKS = { none: 0, Low: 1, Medium: 2, High: 3, Critical: 4 };
      const [highestSeveritySeen, setHighestSeveritySeen] = useState('idle');
      const activeSeverityRef = useRef('idle');

      // Keep activeSeverityRef synced with state for the animate loop
      useEffect(() => {
        if (scanState.status === 'failed') {
          activeSeverityRef.current = 'error';
        } else {
          activeSeverityRef.current = highestSeveritySeen;
        }
      }, [highestSeveritySeen, scanState.status]);

      // SessionStorage-Based Historical Scans State
      const [scanHistory, setScanHistory] = useState(() => {
        try {
          const stored = sessionStorage.getItem('sentinel_scan_history');
          return stored ? JSON.parse(stored) : [];
        } catch (e) {
          return [];
        }
      });

      // Refs
      const lenisRef = useRef(null);
      const tweenRef = useRef(null);
      const trackRef = useRef(null);
      const sliderRef = useRef(null);
      const pollTimerRef = useRef(null);
      const previousIndexRef = useRef(0);
      const prefersReduced = useReducedMotionSafe();

      // All 5 Sections: Home through Architectural Standard
      const DOSSIER_ITEMS = [
        { id: 'home', num: '01', title: 'HOME' },
        { id: 'scan', num: '02', title: 'SCAN' },
        { id: 'findings', num: '03', title: 'FINDINGS' },
        { id: 'history', num: '04', title: 'HISTORY' },
        { id: 'protocol', num: '05', title: 'PROTOCOL' }
      ];

      // --- LENIS INITIALIZATION & EQUALIZED HORIZONTAL PINNING ---
      useEffect(() => {
        if (!window.Lenis || !window.gsap || !window.ScrollTrigger) return;
        const gsap = window.gsap;
        const ScrollTrigger = window.ScrollTrigger;
        gsap.registerPlugin(ScrollTrigger);

        const lenis = new window.Lenis({
          duration: prefersReduced ? 0.01 : 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          orientation: 'vertical',
          smoothWheel: !prefersReduced,
          touchMultiplier: 1.4,
        });

        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => {
          lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);
        lenisRef.current = lenis;

        // Animate initial home screen
        const homePanel = document.getElementById('home-panel');
        if (homePanel) {
          assembleInSection(homePanel, prefersReduced);
        }

        const slider = sliderRef.current;
        const track = trackRef.current;
        if (slider && track) {
          const panels = slider.querySelectorAll('.horizontal-panel');
          const totalPanels = DOSSIER_ITEMS.length;
          const totalHorizontalDistance = (totalPanels - 1) * window.innerWidth;
          const totalScrollDistance = (totalPanels - 1) * SECTION_GAP;

          const tween = gsap.to(slider, {
            x: () => -totalHorizontalDistance,
            ease: 'none',
            scrollTrigger: {
              trigger: track,
              pin: true,
              scrub: prefersReduced ? 0 : 0.85,
              start: 'top top',
              end: () => `+=${totalScrollDistance}`,
              invalidateOnRefresh: true,
              onUpdate: (self) => {
                const p = self.progress;
                const floatIdx = p * (totalPanels - 1);
                const currentIdx = Math.min(totalPanels - 1, Math.max(0, Math.round(floatIdx)));
                const currentSec = DOSSIER_ITEMS[currentIdx].id;

                setActiveSection(currentSec);

                if (currentIdx !== previousIndexRef.current) {
                  const currPanel = panels[currentIdx];
                  assembleInSection(currPanel, prefersReduced);
                  previousIndexRef.current = currentIdx;
                }
              }
            }
          });
          tweenRef.current = tween;
          ScrollTrigger.refresh();
        }

        return () => {
          lenis.destroy();
          ScrollTrigger.getAll().forEach(st => st.kill());
          gsap.ticker.remove(lenis.raf);
        };
      }, [prefersReduced]);

      // Ambient Three.js Canvas mount (Global Singleton background driven by activeSeverityRef)
      useEffect(() => {
        const canvas = document.getElementById('ambient-canvas');
        if (canvas) {
          const cleanup = initAmbientScene(canvas, prefersReduced, activeSeverityRef);
          return cleanup;
        }
      }, [prefersReduced]);

      // --- SMOOTH SCROLLTO SECTION TRIGGER ---
      const scrollToSection = (secId) => {
        if (!lenisRef.current) return;

        const idx = DOSSIER_ITEMS.findIndex(item => item.id === secId);
        if (idx === -1) return;

        const targetScrollTop = idx * SECTION_GAP;

        lenisRef.current.scrollTo(targetScrollTop, {
          duration: prefersReduced ? 0.01 : 1.25,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
        });

        const panelEl = document.getElementById(`${secId}-panel`);
        if (panelEl) {
          assembleInSection(panelEl, prefersReduced);
        }
      };

      // --- LOAD DOSSIER FROM HISTORY ---
      const loadDossierFromHistory = (item) => {
        if (item.findings && item.findings.length > 0) {
          setFindings(item.findings);
          const crit = item.findings.filter(f => f.severity === 'Critical').length;
          const high = item.findings.filter(f => f.severity === 'High').length;
          setLastScanMeta({ url: item.target, critical: crit, high: high, status: 'COMPLETED' });
        } else if (item.scanId && item.scanId !== 'demo-run') {
          fetch(`/api/scans/${item.scanId}/findings`)
            .then(res => res.json())
            .then(data => {
              setFindings(data);
              const crit = data.filter(f => f.severity === 'Critical').length;
              const high = data.filter(f => f.severity === 'High').length;
              setLastScanMeta({ url: item.target, critical: crit, high: high, status: 'COMPLETED' });
            })
            .catch(() => {});
        }
        setTargetUrl(item.target);
        scrollToSection('findings');
      };

      // --- ESCALATE-ONLY SEVERITY EVALUATION HELPER ---
      const evaluateAndEscalateFindings = (newFindings) => {
        if (!newFindings || !newFindings.length) return;
        setHighestSeveritySeen(prev => {
          let currentHighestRank = SEVERITY_RANKS[prev] || 0;
          let worstFound = prev;

          newFindings.forEach(f => {
            const rank = SEVERITY_RANKS[f.severity] || 0;
            if (rank > currentHighestRank) {
              currentHighestRank = rank;
              worstFound = f.severity;
            }
          });
          return worstFound;
        });
      };

      // --- SCANNER ENGINE & ASYNC POLLING PIPELINE ---
      const pollScanStatus = async (scanId) => {
        try {
          const res = await fetch(`/api/scans/${scanId}`);
          if (!res.ok) throw new Error(`Polling status HTTP ${res.status}`);
          const data = await res.json();

          setScanState(prev => ({
            ...prev,
            status: data.status,
            progress: data.progress || 0,
            total: data.total || 0,
            error: data.error || null
          }));

          // Stream intermediate findings during poll if available
          try {
            const liveFindingsRes = await fetch(`/api/scans/${scanId}/findings`);
            if (liveFindingsRes.ok) {
              const liveData = await liveFindingsRes.json();
              if (liveData && liveData.length > 0) {
                setFindings(liveData);
                evaluateAndEscalateFindings(liveData);
              }
            }
          } catch (e) {}

          if (data.status === 'completed') {
            const findingsRes = await fetch(`/api/scans/${scanId}/findings`);
            let realFindings = [];
            if (findingsRes.ok) {
              realFindings = await findingsRes.json();
            }
            setFindings(realFindings);
            evaluateAndEscalateFindings(realFindings);

            const crit = realFindings.filter(f => f.severity === 'Critical').length;
            const high = realFindings.filter(f => f.severity === 'High').length;
            setLastScanMeta({ url: targetUrl, critical: crit, high: high, status: 'COMPLETED' });

            // Record to sessionStorage
            const newHistoryItem = {
              id: `scan-run-${Math.floor(1000 + Math.random() * 9000)}`,
              scanId: scanId,
              target: targetUrl,
              endpoints: data.total || data.progress || realFindings.length || 6,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              findings: realFindings
            };
            setScanHistory(prev => {
              const updated = [newHistoryItem, ...prev];
              try {
                sessionStorage.setItem('sentinel_scan_history', JSON.stringify(updated));
              } catch (e) {}
              return updated;
            });

            setTimeout(() => {
              scrollToSection('findings');
            }, 600);
          } else if (data.status === 'failed') {
            setScanState(prev => ({ ...prev, status: 'failed', error: data.error || 'Audit failure.' }));
          } else {

              {/* 04 HISTORY PANEL (SESSIONSTORAGE-DRIVEN TELEMETRY DATABASE)            */}
              {/* --------------------------------------------------------------------- */}
              <div id="history-panel" className="horizontal-panel px-6 sm:px-12">
                <div className="glass-tile rounded-3xl p-6 sm:p-8 max-w-3xl w-full shadow-2xl space-y-4 my-auto max-h-[88vh] overflow-y-auto">
                  <div className="pb-4 border-b border-white/10 flex justify-between items-end">
                    <div className="assemble-l">
                      <span className="text-[10px] font-mono tracking-widest text-[#D8FF00] uppercase font-bold">04 // TELEMETRY DATABASE</span>
                      <h3 className="font-bebas text-4xl text-white tracking-wide mt-0.5">HISTORICAL SCANS</h3>
                    </div>
                    {/* Dynamic Session Count Badge */}
                    <span className="assemble-r text-xs font-mono text-[#D8FF00]">
                      {scanHistory.length} ARCHIVED {scanHistory.length === 1 ? 'SESSION' : 'SESSIONS'}
                    </span>
                  </div>

                  {/* Dynamic Session History List */}
                  <div className="space-y-3 max-h-80 overflow-y-auto">
                    {scanHistory.length === 0 ? (
                      <div className="py-12 text-center font-mono text-xs text-[#8E9BA8]">
                        No archived sessions recorded for this session. Complete a scan to record telemetry.
                      </div>
                    ) : (
                      scanHistory.map((item, idx) => {
                        const isOdd = idx % 2 === 0;
                        return (
                          <div
                            key={item.id || idx}
                            className={`${isOdd ? 'assemble-l' : 'assemble-r'} p-4 rounded-xl bg-white/5 border border-white/10 flex justify-between items-center`}
                          >
                            <div>
                              <div className="font-mono text-xs font-bold text-white">{item.id}</div>
                              <div className="font-mono text-[11px] text-[#8E9BA8]">
                                {item.target} · {item.endpoints} endpoints · {item.timestamp}
                              </div>
                            </div>
                            <button
                              onClick={() => loadDossierFromHistory(item)}
                              className="btn-volt-pill px-4 py-1.5 text-xs font-mono cursor-pointer"
                            >
                              LOAD DOSSIER
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>

              {/* --------------------------------------------------------------------- */}
              {/* 05 PROTOCOL / DOCS PANEL (Architectural Standard)                     */}
              {/* --------------------------------------------------------------------- */}
              <div id="protocol-panel" className="horizontal-panel px-6 sm:px-12">
                <div className="glass-tile rounded-3xl p-6 sm:p-8 max-w-3xl w-full shadow-2xl space-y-4 font-mono text-xs my-auto max-h-[88vh] overflow-y-auto">
                  <div className="pb-4 border-b border-white/10 flex justify-between items-end">
                    <div className="assemble-l">
                      <span className="text-[10px] tracking-widest text-[#D8FF00] uppercase font-bold">05 // ARCHITECTURAL STANDARD</span>
                      <h3 className="font-bebas text-4xl text-white tracking-wide mt-0.5">ZERO-TRUST PROTOCOL</h3>
                    </div>
                    <span className="assemble-r text-xs text-[#8E9BA8]">OWASP API SEC</span>
                  </div>

                  <div className="space-y-4 text-white/80 leading-relaxed max-h-80 overflow-y-auto pr-2">
                    <div className="assemble-l p-3.5 rounded-xl bg-white/5 border border-white/10">
                      <span className="text-[#D8FF00] font-bold block mb-1">BOLA / IDOR PERMUTATIONS:</span>
                      Asserting cross-user perimeter boundaries by replaying valid User A requests with User B bearer tokens against resource entity IDs.
                    </div>
                    <div className="assemble-r p-3.5 rounded-xl bg-white/5 border border-white/10">
                      <span className="text-[#D8FF00] font-bold block mb-1">EXCESSIVE DATA EXPOSURE:</span>
                      Cross-referencing schema declarations with actual serialized HTTP responses to flag undeclared credential or token leaks.
                    </div>
                    <div className="assemble-l p-3.5 rounded-xl bg-white/5 border border-white/10">
                      <span className="text-[#D8FF00] font-bold block mb-1">BOUNDED EXECUTION:</span>
                      Confines all probing exclusively to the declared OpenAPI specification without discovery or uncontrolled crawling.
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          {/* DETAIL INSPECTION MODAL */}
          {selectedFinding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-tile rounded-3xl p-8 max-w-2xl w-full border-white/20 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-start pb-4 border-b border-white/10">
                  <div>
                    <span className="px-2.5 py-1 rounded bg-rose-950 text-rose-300 border border-rose-800 text-[10px] font-mono font-bold uppercase">
                      {selectedFinding.severity} · {selectedFinding.vulnerability_class}
                    </span>
                    <h3 className="font-bebas text-3xl text-white tracking-wide mt-2">{selectedFinding.title}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedFinding(null)}
                    className="w-8 h-8 rounded-full bg-white/10 text-white flex items-center justify-center font-bold hover:bg-[#D8FF00] hover:text-black transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <div>
                  <label className="text-[10px] font-mono text-[#D8FF00] uppercase block mb-1 font-bold">Observed Variance</label>
                  <p className="text-xs font-mono text-white/80 leading-relaxed bg-black/60 p-3.5 rounded-xl border border-white/10">
                    {selectedFinding.description}
                  </p>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-[10px] font-mono text-[#D8FF00] uppercase font-bold">Proof of Concept Replay</label>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(selectedFinding.poc_curl || '');
                        alert('Copied cURL command to clipboard');
                      }}
                      className="text-[10px] font-mono text-black bg-[#D8FF00] px-3 py-1 rounded-full font-bold hover:bg-white transition-colors"
                    >
                      COPY CURL
                    </button>
                  </div>
                  <div className="bg-black/90 p-3.5 rounded-xl border border-white/10 font-mono text-[11px] text-teal-300 overflow-x-auto">
                    {selectedFinding.poc_curl}
                  </div>
                </div>

                <div>
                  <label className="text-[10px] font-mono text-[#D8FF00] uppercase block mb-1 font-bold">Prescribed Fix</label>
                  <p className="text-xs font-mono text-teal-200/90 leading-relaxed bg-teal-950/40 p-3.5 rounded-xl border border-teal-800/40">
                    {selectedFinding.remediation}
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="relative z-30 p-8 border-t border-white/10 text-center font-mono text-xs text-[#8E9BA8]">
            SENTINELAPI · BOUNDED SECURITY TESTING FOR EXPLICITLY AUTHORIZED TARGETS
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SentinelApp />);
  </script>
</body>
</html>
